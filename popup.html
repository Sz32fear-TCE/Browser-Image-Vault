<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Image Vault</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Image Vault</h2>
      
    </div>
    
    <!-- Upload Section -->
    <div class="form-group">
      <input type="text" id="imageName" placeholder="Enter image name..." />
      <input type="file" id="imageFile" accept="image/*" />
      <button id="saveBtn">Save to Database</button>
    </div>

    <hr>

    <!-- Search & Utility Controls -->
    <div class="controls">
      <input type="text" id="searchBar" placeholder="🔍 Search saved images..." />
      <button id="exportBtn" class="secondary-btn">Export Backup (JSON)</button>
    </div>

    <h3>Stored Images</h3>
    <div id="imageGallery"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
